<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SL Hits - Trading Signals Dashboard</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-page="slhits">
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-dot"></span>Signals<span class="brand-accent">Lab</span></a>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="active-signals.html">Active Signals</a>
      <a href="signals.html">Signals Browser</a>
      <a href="sl-hits.html" class="active">SL Hits</a>
    </div>
    <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
  </div>
</nav>

<main class="container">
  <div id="app-error" class="error-banner hidden"></div>
  <div id="load-progress" class="load-progress">Loading signal data&hellip;</div>

  <section id="slhits-section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:1rem">
      <h2 class="section-title" style="margin:0">Stop Loss Hits</h2>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span id="slhits-count-badge" class="badge badge-sl" style="font-size:.9rem">0 SL hits</span>
        <button id="slhits-export" class="btn btn-secondary">Export CSV</button>
      </div>
    </div>
    
    <div class="toolbar">
      <input type="search" id="slhits-search" class="input" placeholder="Search symbol, date, direction..." style="flex:1;min-width:220px" />
      <select id="slhits-page-size" class="input select" style="width:auto">
        <option value="25">25 per page</option>
        <option value="50">50 per page</option>
        <option value="100">100 per page</option>
      </select>
    </div>
    
    <div class="table-wrap" id="slhits-table"></div>
    <div class="pagination" id="slhits-pagination"></div>
  </section>

  <section id="slhits-analytics" style="margin-top:2rem">
    <h2 class="section-title">SL Hits Analytics</h2>
    <div class="analytics-grid">
      <div class="card"><h4>By Symbol</h4><div id="slhits-by-symbol" class="table-wrap"></div></div>
      <div class="card"><h4>By Month</h4><div id="slhits-by-month" class="table-wrap"></div></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <a id="repo-link" href="#" target="_blank" rel="noopener">Repository</a>
    <span id="last-refresh">Last refresh: &ndash;</span>
    <span>Static deployment via GitHub Pages &middot; no backend</span>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
